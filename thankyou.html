<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Received — Bubble Tea Bros</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 560px; margin: 60px auto; text-align: center; }
        /* the order summary box (filled in by the optional script below) */
        #summary {
            margin: 20px auto;
            padding: 16px 20px;
            max-width: 420px;
            background-color: #FDF3E3;
            border: 1px solid #E7D3A8;
            border-radius: 10px;
            font-size: 1.05em;
        }
    </style>
</head>
<body>
    <h1>🧋 Thank you!</h1>
    <p>Your order has been received.</p>

    <!-- ============================================================
         CORE LESSON (no JavaScript needed):
         Everything after the ? in the address bar is your form's data.
         ============================================================ -->
    <p><strong>Now look at the address bar above ⬆</strong><br>
       Everything after the <code>?</code> is the data your form just sent —
       one <code>name=value</code> pair per form control, joined by <code>&amp;</code>.</p>

    <!-- The script below fills this box in. If you delete the script,
         the page still works — it just won't show the summary. -->
    <p id="summary">Reading your order from the address bar…</p>

    <p><a href="activity1_orderform_starter.html">← Back to the order form</a></p>

    <!-- ============================================================
         ⭐ OPTIONAL — BEYOND THE SYLLABUS (not required for marks)
         ------------------------------------------------------------
         HTML on its own cannot read the ?name=value data. This little
         block of JavaScript does it, so the order appears ON the page
         instead of only in the address bar. Real websites work this way.

         It reads the SAME name="..." values you set on the form:
           custname, size, drink   (change these to match YOUR form)
         .get("x") returns null if that field is missing, so we supply
         a friendly fallback with the  || "…"  trick.
         ============================================================ -->
    <script>
        // 1. Grab everything after the ? in the address bar
        const data = new URLSearchParams(window.location.search);

        // 2. Pull out the values by their form name= (with safe fallbacks)
        const name  = data.get("custname") || "there";
        const size  = data.get("size")     || "your";
        const drink = data.get("drink")    || "drink";

        // 3. Build a friendly sentence and drop it into the summary box
        const box = document.getElementById("summary");
        if (data.toString() === "") {
            // Page opened directly, with no form data in the URL
            box.textContent = "Tip: submit the order form to see your order appear here.";
        } else {
            box.textContent = `Thanks ${name}! Your ${size} ${drink} order is confirmed. 🧋`;
        }
    </script>

</body>
</html>
